asyncapi: 2.6.0
info:
  title: Video Processing Events
  version: 1.0.0
  description: Events related to video uploading and transcoding.
channels:
  video.uploaded:
    publish:
      message:
        $ref: '#/components/messages/VideoUploaded'
  video.processed:
    subscribe:
      message:
        $ref: '#/components/messages/VideoProcessed'
components:
  messages:
    VideoUploaded:
      payload:
        type: object
        properties:
          videoId:
            type: string
          filePath:
            type: string
    VideoProcessed:
      payload:
        type: object
        properties:
          videoId:
            type: string
          status:
            type: string
            enum: [completed, failed]
          playlistUrl:
            type: string
